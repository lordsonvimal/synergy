root = "."
tmp_dir = "tmp/assets"

[build]
  # Rebuild the JS bundles + manifest on any source asset change, then notify
  # the templ proxy so connected browsers reload. The build is dev-mode (no
  # hashing) so the same logical names keep working without restarting the Go
  # server.
  cmd = "CHESS_BUILD_DEV=1 yarn build:js --silent && CHESS_BUILD_DEV=1 yarn build:assets --silent && templ generate --notify-proxy"
  bin = "/usr/bin/true"
  delay = 100
  include_dir = ["assets"]
  include_ext = ["js", "css"]

[screen]
  clear_on_rebuild = false
