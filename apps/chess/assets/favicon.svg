<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark rounded background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>

  <!-- 4x4 chessboard pattern -->
  <g opacity="0.15">
    <!-- Row 1 -->
    <rect x="0" y="0" width="16" height="16" fill="#FBBF24"/>
    <rect x="32" y="0" width="16" height="16" fill="#FBBF24"/>
    <!-- Row 2 -->
    <rect x="16" y="16" width="16" height="16" fill="#FBBF24"/>
    <rect x="48" y="16" width="16" height="16" fill="#FBBF24"/>
    <!-- Row 3 -->
    <rect x="0" y="32" width="16" height="16" fill="#FBBF24"/>
    <rect x="32" y="32" width="16" height="16" fill="#FBBF24"/>
    <!-- Row 4 -->
    <rect x="16" y="48" width="16" height="16" fill="#FBBF24"/>
    <rect x="48" y="48" width="16" height="16" fill="#FBBF24"/>
  </g>

  <!-- L-shaped knight path (2 up, 1 right) — gold -->
  <g opacity="0.35">
    <rect x="4" y="36" width="10" height="10" rx="1.5" fill="#FBBF24"/>
    <rect x="4" y="25" width="10" height="10" rx="1.5" fill="#FBBF24"/>
    <rect x="15" y="25" width="10" height="10" rx="1.5" fill="#FBBF24"/>
  </g>
  <!-- Path stroke -->
  <polyline points="9,41 9,30 20,30" stroke="#FBBF24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Arrow head -->
  <polygon points="18,27 23,30 18,33" fill="#FBBF24" opacity="0.7"/>

  <!-- CBurnett white knight piece (BSD licensed) -->
  <g transform="translate(16, 6) scale(1.05)" style="fill:none; fill-opacity:1; fill-rule:evenodd; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; stroke-miterlimit:4; stroke-dasharray:none; stroke-opacity:1;">
    <path
      d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"
      style="fill:#ffffff; stroke:#ffffff; stroke-width:0.8;"/>
    <path
      d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10"
      style="fill:#ffffff; stroke:#ffffff; stroke-width:0.8;"/>
    <!-- Eye -->
    <path
      d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5,25.5 A 0.5 0.5 0 1 1 9.5 25.5 z"
      style="fill:#0F172A; stroke:#0F172A;"/>
    <!-- Nostril -->
    <path
      d="M 15 15.5 A 0.5 1.5 0 1 1 14,15.5 A 0.5 1.5 0 1 1 15 15.5 z"
      transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)"
      style="fill:#0F172A; stroke:#0F172A;"/>
    <!-- Base pedestal -->
    <rect x="13" y="39" width="27" height="4" rx="1.5" style="fill:#ffffff;"/>
    <rect x="11" y="43" width="31" height="5" rx="2" style="fill:#ffffff;"/>
    <line x1="14" y1="45.5" x2="39" y2="45.5" style="stroke:#0F172A; stroke-width:0.8; opacity:0.3;"/>
  </g>
</svg>
